
<ion-content>
  <ion-button fill="clear" color="secondary" (click)="goBack()">
    <ion-icon name="arrow-back-outline"></ion-icon>
  </ion-button>
  <div class="inscription-container">
    <img src="assets/logo.png" alt="Comptazone Logo" class="logo"/>
    <h1>Créer un compte</h1>
    <form (ngSubmit)="register()">
      <ion-item>
        <ion-label position="floating">Nom</ion-label>
        <ion-input type="text" [(ngModel)]="name" name="name" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input type="email" [(ngModel)]="email" name="email" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Mot de passe</ion-label>
        <ion-input type="password" [(ngModel)]="password" name="password" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Confirmer le mot de passe</ion-label>
        <ion-input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required></ion-input>
      </ion-item>
      <ion-button expand="full" shape="round" type="submit" color="primary">
        S'inscrire
      </ion-button>
    </form>
  </div>
</ion-content>
