<ion-header>
  <ion-toolbar color="secondary">
    <ion-menu-button slot="start" color="light"></ion-menu-button>
    <ion-title>Accueil</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <img src="assets/logo.png" alt="Comptazone Logo" class="logo" />
  <ion-card class="welcome-card">
    <ion-card-header>
      <ion-card-title color="secondary">Bienvenue sur Comptazone</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>Nous sommes ravis de vous accueillir sur notre plateforme de comptabilité.</p>
      <ion-grid>
        <ion-row>
          <ion-col size="6">
            <ion-card>
              <ion-card-content class="butt">
                <ion-button expand="full" (click)="navigateTo('support')">
                  <ion-icon slot="start" name="chatbubbles-outline"></ion-icon>
                  Support
                </ion-button>
              </ion-card-content>
            </ion-card>
          </ion-col>
          <ion-col size="6">
            <ion-card>
              <ion-card-content class="butt">
                <ion-button expand="full" (click)="navigateTo('notifications')" color="secondary">
                  <ion-icon slot="start" name="notifications-outline"></ion-icon>
                  Notifications
                </ion-button>
              </ion-card-content>
            </ion-card>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>
</ion-content>
